# Run on your LAN: set hosts to internal FileMaker Server / Cloud endpoints.
# Secrets: use Docker secrets, a vault, or `.env` not committed to git.

services:
  fremirror:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_LEVEL: INFO
      # FREEMIRROR_ONCE: "1"   # optional: single sync then exit (for cron)
    # ports:
    #   - "8080:8080"  # add when you expose a health/metrics HTTP server
