apiVersion: apps/v1
kind: Deployment
metadata:
  name: freesync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freesync
  template:
    metadata:
      labels:
        app: freesync
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: freesync
          image: docker.io/replace-me/freesync:latest
          imagePullPolicy: Always
          args:
            - serve
            - -listen
            - :8080
            - -apply
          env:
            - name: FREESYNC_CONFIG
              value: /app/config/dev.local.json
            - name: FREESYNC_STATE
              value: /app/data/sync-state.json
            - name: FREESYNC_VERBOSE
              value: "false"
            - name: FREESYNC_TRIGGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: freesync-secret
                  key: triggerToken
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: state
              mountPath: /app/data
      volumes:
        - name: config
          secret:
            secretName: freesync-config
            items:
              - key: dev.local.json
                path: dev.local.json
        - name: state
          persistentVolumeClaim:
            claimName: freesync-state-pvc
