apiVersion: apps/v1
kind: Deployment
metadata:
  name: freesync
  namespace: freesync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freesync
  template:
    metadata:
      labels:
        app: freesync
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: freesync
          image: docker.io/delfseng/freesync:sha-4f19b6ebbdad1abb94278ca13bc367e998564b51
          imagePullPolicy: Always
          args:
            - serve
            - -listen
            - :8080
            - -apply
          env:
            - name: FREESYNC_CONFIG
              value: /app/config/prod.local.json
            - name: FREESYNC_STATE
              value: /app/data/sync-state.json
            - name: FREESYNC_VERBOSE
              value: "false"
            - name: FREESYNC_TRIGGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: freesync-secret
                  key: triggerToken
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: state
              mountPath: /app/data
      volumes:
        - name: config
          secret:
            secretName: freesync-config
            items:
              - key: prod.local.json
                path: prod.local.json
        - name: state
          emptyDir: {}
